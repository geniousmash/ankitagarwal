<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC5E1F" />
      <stop offset="100%" stop-color="#FFA843" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000027" />
      <stop offset="100%" stop-color="#14144b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#FC5E1F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Shape -->
  <circle cx="300" cy="330" r="230" fill="url(#circleGrad)" filter="url(#shadow)"/>
  <circle cx="480" cy="180" r="45" fill="#FFE5D9" opacity="0.6"/>
  <circle cx="120" cy="460" r="28" fill="#FFF2EC" opacity="0.8"/>
  
  <!-- Subtle decorative grid dots -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="150" cy="200" r="4"/>
    <circle cx="170" cy="200" r="4"/>
    <circle cx="190" cy="200" r="4"/>
    <circle cx="150" cy="220" r="4"/>
    <circle cx="170" cy="220" r="4"/>
    <circle cx="190" cy="220" r="4"/>
  </g>

  <!-- Silhouette / Stylized CA Illustration -->
  <g>
    <!-- Shoulders & Suit -->
    <path d="M 160 580 C 160 470, 220 440, 300 440 C 380 440, 440 470, 440 580 Z" fill="url(#suitGrad)"/>
    <!-- Shirt collar -->
    <polygon points="300,440 265,495 300,535 335,495" fill="#ffffff"/>
    <!-- Tie -->
    <polygon points="295,495 305,495 310,590 290,590" fill="#FC5E1F"/>
    <polygon points="292,492 308,492 305,515 295,515" fill="#e04c10"/>
    <!-- Lapels -->
    <path d="M 230 460 L 265 540 L 255 580 L 195 560 Z" fill="#0c0c38"/>
    <path d="M 370 460 L 335 540 L 345 580 L 405 560 Z" fill="#0c0c38"/>
    <!-- Neck -->
    <rect x="278" y="380" width="44" height="65" rx="8" fill="#F8CBA6"/>
    <!-- Head -->
    <ellipse cx="300" cy="330" rx="68" ry="78" fill="#FCD9B8"/>
    <!-- Hair -->
    <path d="M 232 320 C 230 260, 260 220, 300 220 C 345 220, 370 260, 368 320 C 360 270, 340 245, 300 245 C 260 245, 240 270, 232 320 Z" fill="#1C1A27"/>
    <!-- Glasses -->
    <rect x="250" y="308" width="40" height="26" rx="8" fill="none" stroke="#000027" stroke-width="4"/>
    <rect x="310" y="308" width="40" height="26" rx="8" fill="none" stroke="#000027" stroke-width="4"/>
    <line x1="290" y1="320" x2="310" y2="320" stroke="#000027" stroke-width="4"/>
    <line x1="235" y1="316" x2="250" y2="318" stroke="#000027" stroke-width="3"/>
    <line x1="350" y1="318" x2="365" y2="316" stroke="#000027" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="270" cy="320" r="5" fill="#000027"/>
    <circle cx="330" cy="320" r="5" fill="#000027"/>
    <circle cx="272" cy="318" r="1.5" fill="#ffffff"/>
    <circle cx="332" cy="318" r="1.5" fill="#ffffff"/>
    <!-- Eyebrows -->
    <path d="M 252 298 Q 270 292 288 298" stroke="#1C1A27" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 312 298 Q 330 292 348 298" stroke="#1C1A27" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 282 365 Q 300 380 318 365" stroke="#9E4822" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Floating Badge: Experience -->
  <g transform="translate(60, 480)">
    <rect width="180" height="68" rx="16" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="36" cy="34" r="20" fill="#FFF2EC"/>
    <text x="36" y="40" font-family="sans-serif" font-size="18" text-anchor="middle">⭐</text>
    <text x="68" y="30" font-family="Poppins, sans-serif" font-weight="800" font-size="16" fill="#000027">10+ Years</text>
    <text x="68" y="48" font-family="Poppins, sans-serif" font-weight="500" font-size="11" fill="#868686">Experience</text>
  </g>

  <!-- Floating Badge: ICAI Fellow -->
  <g transform="translate(370, 160)">
    <rect width="170" height="68" rx="16" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="36" cy="34" r="20" fill="#FFF2EC"/>
    <text x="36" y="40" font-family="sans-serif" font-size="18" text-anchor="middle">🏆</text>
    <text x="68" y="30" font-family="Poppins, sans-serif" font-weight="800" font-size="15" fill="#000027">FCA Certified</text>
    <text x="68" y="48" font-family="Poppins, sans-serif" font-weight="500" font-size="11" fill="#FC5E1F">ICAI Fellow Member</text>
  </g>
</svg>